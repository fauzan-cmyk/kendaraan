<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Daftar</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
      --color-navy: #0f172a;
      --color-navy-aktif: #1e293b;
      --color-kuning: #fbbf24;
      --color-kuning-muda: #fcd34d;
      --radius-kartu: 14px;
      --radius-isian: 10px;
    }
  </style>
</head>
<body class="flex min-h-screen items-center justify-center bg-navy font-sans">
  <form id="daftar" class="flex w-80 flex-col gap-4 rounded-kartu bg-white p-7">
    <div class="flex flex-col items-center gap-2">
      <img src="img/logo.jpg" alt="Logo" class="h-24 w-auto max-w-full object-contain" />
      <span class="text-base font-extrabold">Rental Kendaraan</span>
    </div>
    <h1 class="text-lg font-extrabold">Buat akun</h1>
    <label class="flex flex-col gap-1.5 text-[13px] font-bold text-slate-700">Username
      <input name="username" required minlength="3" maxlength="30" class="h-[42px] rounded-isian border border-slate-300 px-3 text-sm font-normal" /></label>
    <label class="flex flex-col gap-1.5 text-[13px] font-bold text-slate-700">Password
      <input name="password" type="password" required minlength="6" class="h-[42px] rounded-isian border border-slate-300 px-3 text-sm font-normal" /></label>
    <label class="flex flex-col gap-1.5 text-[13px] font-bold text-slate-700">Ulangi password
      <input name="ulangi" type="password" required class="h-[42px] rounded-isian border border-slate-300 px-3 text-sm font-normal" /></label>
    <button class="h-[42px] cursor-pointer rounded-isian bg-kuning text-sm font-extrabold text-navy hover:bg-kuning-muda">Daftar</button>
    <p class="text-center text-[13px] text-slate-500">Sudah punya akun? <a href="login.html" class="font-bold text-navy underline">Masuk</a></p>
  </form>
<script>
  document.getElementById("daftar").addEventListener("submit", async (e) => {
    e.preventDefault();
    const respon = await fetch("/api/auth/daftar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.fromEntries(new FormData(e.target)))
    });
    const hasil = await respon.json();
    if (respon.ok) {
      alert("Akun berhasil dibuat. Silakan masuk.");
      location.href = "login.html";
    } else {
      alert(hasil.pesan)
    }
  });
</script>
</body>
</html>
